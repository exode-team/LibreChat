name: Docker Compose Build Release Image (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build (e.g. v0.8.7). Leave empty for the latest stable tag.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          git fetch --tags --force
          REQUESTED='${{ inputs.version }}'
          if [ -n "$REQUESTED" ]; then
            LATEST_TAG="$REQUESTED"
          else
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | { grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' || true; } | head -n 1)
          fi
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No stable v<semver> tag found"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$LATEST_TAG" >/dev/null; then
            echo "::error::Tag $LATEST_TAG does not exist"
            exit 1
          fi
          NEWEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | { grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' || true; } | head -n 1)
          if [ "$LATEST_TAG" = "$NEWEST_TAG" ]; then
            PUSH_LATEST=true
          else
            PUSH_LATEST=false
            echo "::notice::$LATEST_TAG is not the newest stable tag ($NEWEST_TAG); the :latest tag will not be moved"
          fi
          {
            printf 'tag=%s\n' "$LATEST_TAG"
            printf 'commit=%s\n' "$(git rev-parse "refs/tags/$LATEST_TAG^{commit}")"
            echo 'tags<<EOF'
            printf '%s\n' "$LATEST_TAG"
            if [ "$PUSH_LATEST" = 'true' ]; then
              printf 'latest\n'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/docker-multiarch.yml
    with:
      target: api-build
      file: Dockerfile.multi
      image_name: librechat-api
      ref: refs/tags/${{ needs.resolve.outputs.tag }}
      build_commit: ${{ needs.resolve.outputs.commit }}
      build_branch: ${{ needs.resolve.outputs.tag }}
      tags: ${{ needs.resolve.outputs.tags }}
    secrets: inherit
