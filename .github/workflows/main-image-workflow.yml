name: Docker Compose Build Release Image (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build (e.g. v0.8.7). Leave empty for the latest stable tag.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/librechat-api

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      push_latest: ${{ steps.resolve.outputs.push_latest }}
      commit: ${{ steps.resolve.outputs.commit }}
      date: ${{ steps.resolve.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          git fetch --tags --force
          REQUESTED='${{ inputs.version }}'
          if [ -n "$REQUESTED" ]; then
            LATEST_TAG="$REQUESTED"
          else
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | { grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' || true; } | head -n 1)
          fi
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No stable v<semver> tag found"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$LATEST_TAG" >/dev/null; then
            echo "::error::Tag $LATEST_TAG does not exist"
            exit 1
          fi
          NEWEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | { grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' || true; } | head -n 1)
          if [ "$LATEST_TAG" = "$NEWEST_TAG" ]; then
            PUSH_LATEST=true
          else
            PUSH_LATEST=false
            echo "::notice::$LATEST_TAG is not the newest stable tag ($NEWEST_TAG); the :latest tag will not be moved"
          fi
          {
            printf 'tag=%s\n' "$LATEST_TAG"
            printf 'push_latest=%s\n' "$PUSH_LATEST"
            printf 'commit=%s\n' "$(git rev-parse "refs/tags/$LATEST_TAG^{commit}")"
            printf 'date=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment
        run: |
          cp .env.example .env

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.multi
          target: api-build
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_COMMIT=${{ needs.resolve.outputs.commit }}
            BUILD_BRANCH=${{ needs.resolve.outputs.tag }}
            BUILD_DATE=${{ needs.resolve.outputs.date }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Sanitize platform name
        run: |
          printf 'PLATFORM_PAIR=%s\n' "$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          TAG_ARGS="-t $IMAGE:${{ needs.resolve.outputs.tag }}"
          if [ '${{ needs.resolve.outputs.push_latest }}' = 'true' ]; then
            TAG_ARGS="$TAG_ARGS -t $IMAGE:latest"
          fi
          docker buildx imagetools create $TAG_ARGS \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ needs.resolve.outputs.tag }}"
