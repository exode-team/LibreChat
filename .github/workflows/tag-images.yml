name: Docker Images Build on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release-tag:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.image-tags.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release-tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_REGEX='^v[0-9]+[.][0-9]+[.][0-9]+(-rc[0-9]+)?$'
          STABLE_TAG_REGEX='^v[0-9]+[.][0-9]+[.][0-9]+$'
          if [[ ! "$REF_NAME" =~ $TAG_REGEX ]]; then
            echo "::error::Docker release tags must use v<semver> or v<semver>-rcN, for example v0.8.5 or v0.8.5-rc1"
            exit 1
          fi
          printf 'image_tag=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$REF_NAME" =~ $STABLE_TAG_REGEX ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tags
        id: image-tags
        env:
          IMAGE_TAG: ${{ steps.release-tag.outputs.image_tag }}
          IS_STABLE: ${{ steps.release-tag.outputs.is_stable }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST_STABLE_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | { grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' || true; } | head -n 1)
          {
            echo 'tags<<EOF'
            printf '%s\n' "$IMAGE_TAG"
            if [ "$IS_STABLE" = 'true' ] && [ "$IMAGE_TAG" = "$LATEST_STABLE_TAG" ]; then
              printf 'latest\n'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api-build
            file: Dockerfile.multi
            image_name: librechat-api
          - target: node
            file: Dockerfile
            image_name: librechat
    uses: ./.github/workflows/docker-multiarch.yml
    with:
      target: ${{ matrix.target }}
      file: ${{ matrix.file }}
      image_name: ${{ matrix.image_name }}
      dockerhub: true
      tags: ${{ needs.release-tag.outputs.tags }}
    secrets: inherit
